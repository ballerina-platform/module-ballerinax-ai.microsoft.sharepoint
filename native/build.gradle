plugins {
    id 'java'
}

description = 'SharePoint document data loader - Java native utils'

dependencies {
    // Provided by the Ballerina runtime at execution time.
    implementation group: 'org.ballerinalang', name: 'ballerina-runtime', version: "${ballerinaLangVersion}"

    // Apache Tika: text extraction for PDF documents. Compiled against here; the
    // same jars are declared as platform dependencies in Ballerina.toml. The Office
    // (POI) stack is intentionally not used — this loader extracts text from PDFs only.
    implementation group: 'org.apache.tika', name: 'tika-core', version: "${tikaVersion}"
    implementation group: 'org.apache.tika', name: 'tika-parser-pdf-module', version: "${tikaVersion}"
}

// No sourceCompatibility/targetCompatibility pin here: the compile target follows the JDK the
// build runs on. Pinning it to Java 21 breaks the "Extra JDK Compatibility" CI job, where Gradle
// rejects the JVM 25-only ballerina-runtime of newer Ballerina distributions for a 21 target.
